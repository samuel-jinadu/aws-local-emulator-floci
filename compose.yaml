services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped
    privileged: true
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLOCI_STORAGE_MODE=hybrid
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      - FLOCI_HOSTNAME=floci
      - QUARKUS_HTTP_HOST=0.0.0.0
      - FLOCI_SECURITY_ALLOW_UNSAFE_NETWORK_EXPOSURE=true 
      - FLOCI_SERVICES_EC2_ENABLED=true
      - FLOCI_SERVICES_LAMBDA_ENABLED=true
      - FLOCI_SERVICES_RDS_ENABLED=true

  floci-dash:
    image: ghcr.io/ofsazib/floci-dash:latest
    container_name: floci-dash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566      
      - FLOCI_URL=http://floci:4566  
    depends_on:
      - floci

volumes:
  floci-data: